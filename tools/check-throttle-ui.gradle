allprojects {
    afterEvaluate {
        tasks.register('compileThrottleUiHarness',JavaCompile) {
            source=fileTree('tools/throttle-ui-harness'){include '**/*.java'}
            classpath=sourceSets.main.compileClasspath+sourceSets.main.output
            destinationDirectory=layout.buildDirectory.dir('throttle-ui-classes')
            options.encoding='UTF-8'
            dependsOn 'classes'
        }
        tasks.register('throttleUiHarnessJar',Jar) {
            dependsOn 'compileThrottleUiHarness'
            from layout.buildDirectory.dir('throttle-ui-classes')
            from('tools/throttle-ui-harness'){include 'META-INF/**'}
            archiveFileName='emucab-throttle-ui-test.jar'
            destinationDirectory=layout.buildDirectory.dir('throttle-ui-server/mods')
            doLast {copy {from archiveFile; into 'build/throttle-ui-client/mods'}}
        }
        neoForge.runs.server.gameDirectory=file('build/throttle-ui-server')
        tasks.named('runServer'){dependsOn 'throttleUiHarnessJar'}
        neoForge.runs.client.gameDirectory=file('build/throttle-ui-client')
        neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer','127.0.0.1:25580','--width','1280','--height','800'
        tasks.named('runClient'){dependsOn 'throttleUiHarnessJar'}
    }
}
