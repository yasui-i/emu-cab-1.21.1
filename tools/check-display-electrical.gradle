allprojects { afterEvaluate {
    tasks.register('compileElectricalDisplayHarness',JavaCompile){
        source=fileTree('tools/display-electrical-harness'){include '**/*.java'}
        classpath=sourceSets.main.compileClasspath+sourceSets.main.output
        destinationDirectory=layout.buildDirectory.dir('display-electrical-classes')
        options.encoding='UTF-8';dependsOn 'classes'
    }
    tasks.register('electricalDisplayHarnessJar',Jar){
        dependsOn 'compileElectricalDisplayHarness';from layout.buildDirectory.dir('display-electrical-classes')
        from('tools/display-electrical-harness'){include 'META-INF/**'}
        archiveFileName='emucab-gauge-test.jar';destinationDirectory=layout.buildDirectory.dir('display-electrical-server/mods')
        doLast{copy{from archiveFile;into 'build/display-electrical-client/mods'}}
    }
    neoForge.runs.server.gameDirectory=file('build/display-electrical-server')
    neoForge.runs.server.logLevel=org.slf4j.event.Level.INFO
    tasks.named('runServer'){dependsOn 'electricalDisplayHarnessJar'}
    neoForge.runs.client.gameDirectory=file('build/display-electrical-client')
    neoForge.runs.client.logLevel=org.slf4j.event.Level.INFO
    neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer','127.0.0.1:25583','--width','1280','--height','800'
    tasks.named('runClient'){dependsOn 'electricalDisplayHarnessJar'}
} }
