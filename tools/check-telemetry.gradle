allprojects {afterEvaluate {
    tasks.register('compileTelemetryHarness',JavaCompile){
        source=fileTree('tools/telemetry-harness'){include '**/*.java'}
        classpath=sourceSets.main.compileClasspath+sourceSets.main.output
        destinationDirectory=layout.buildDirectory.dir('telemetry-harness-classes')
        options.encoding='UTF-8';dependsOn 'classes'
    }
    tasks.register('telemetryHarnessJar',Jar){
        dependsOn 'compileTelemetryHarness';from layout.buildDirectory.dir('telemetry-harness-classes')
        from('tools/telemetry-harness'){include 'META-INF/**'}
        archiveFileName='emucab-telemetry-test.jar';destinationDirectory=layout.buildDirectory.dir('telemetry-server/mods')
    }
    neoForge.runs.server.gameDirectory=file('build/telemetry-server')
    tasks.named('runServer'){
        dependsOn 'telemetryHarnessJar'
        doFirst{file('build/telemetry-server/telemetry-check.txt').delete()}
        doLast{def result=file('build/telemetry-server/telemetry-check.txt');if(!result.exists()||!result.text.startsWith('PASS:'))throw new GradleException(result.exists()?result.text:'Telemetry harness did not finish')}
    }
}}
