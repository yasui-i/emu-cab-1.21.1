allprojects { afterEvaluate {
    def testDir=project.findProperty('testGameDir')?:'build/motor-server'
    if(project.hasProperty('packagedModTest'))neoForge.mods.clear()
    tasks.register('compileMotorHarness',JavaCompile) {
        source=fileTree('tools/motor-harness') { include '**/*.java' }
        classpath=sourceSets.main.compileClasspath+sourceSets.main.output
        destinationDirectory=layout.buildDirectory.dir('motor-harness-classes')
        options.encoding='UTF-8';dependsOn 'classes'
    }
    tasks.register('motorHarnessJar',Jar) {
        dependsOn 'compileMotorHarness';from layout.buildDirectory.dir('motor-harness-classes')
        from('tools/motor-harness') { include 'META-INF/**' }
        archiveFileName='emucab-motor-test.jar';destinationDirectory=file(testDir+'/mods')
        doLast { copy { from archiveFile; into 'build/motor-client/mods' } }
    }
    neoForge.runs.server.gameDirectory=file(testDir)
    if(project.hasProperty('motorClientCheck'))neoForge.runs.server.systemProperty 'emucab.test.motorClient','true'
    tasks.named('runServer'){
        dependsOn 'motorHarnessJar'
        doFirst{file(testDir+'/motor-server-check.txt').delete()}
        doLast{def result=file(testDir+'/motor-server-check.txt');if(!result.exists()||result.text.contains('FAIL'))throw new GradleException(result.exists()?result.text:'Motor harness did not finish')}
    }
    neoForge.runs.client.gameDirectory=file('build/motor-client')
    neoForge.runs.client.systemProperty 'sun.net.client.defaultReadTimeout','5000'
    neoForge.runs.client.systemProperty 'sun.net.client.defaultConnectTimeout','5000'
    if(project.hasProperty('motorRangeOnly'))neoForge.runs.client.systemProperty 'emucab.test.rangeOnly','true'
    neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer','127.0.0.1:25582','--width','960','--height','640'
    tasks.named('runClient'){dependsOn 'motorHarnessJar'}
} }
