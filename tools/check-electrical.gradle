// Isolated real-server integration checks. Never uses a player save or installation directory.
allprojects {
    afterEvaluate {
        tasks.register('compileElectricalHarness', JavaCompile) {
            source=fileTree('tools/electrical-harness') { include '**/*.java' }
            classpath=sourceSets.main.compileClasspath+sourceSets.main.output+files('../pw-sable-fix-1.21.1/libs/pantographsandwires.jar','../pw-sable-fix-1.21.1/libs/dragonlib.jar','../pw-sable-fix-1.21.1/libs/geckolib.jar')
            destinationDirectory=layout.buildDirectory.dir('electrical-harness-classes')
            options.encoding='UTF-8'
            dependsOn 'classes'
        }
        tasks.register('electricalHarnessJar', Jar) {
            dependsOn 'compileElectricalHarness'
            from layout.buildDirectory.dir('electrical-harness-classes')
            from('tools/electrical-harness') { include 'META-INF/**' }
            archiveFileName='emucab-electrical-test.jar'
            destinationDirectory=layout.buildDirectory.dir('electrical-server/mods')
            doLast { copy { from archiveFile; into 'build/electrical-client/mods' } }
        }
        neoForge.runs.server.gameDirectory=file('build/electrical-server')
        tasks.named('runServer') {
            dependsOn 'electricalHarnessJar'
            doFirst { file('build/electrical-server/electrical-check-result.txt').delete() }
            doLast { def result=file('build/electrical-server/electrical-check-result.txt');if(!result.exists()||result.text.contains('FAIL'))throw new GradleException(result.exists()?result.text:'Electrical harness did not finish') }
        }
        if(project.hasProperty('electricalClientCheck')) {
            neoForge.runs.server.systemProperty 'emucab.test.electricalClient','true'
        }
        neoForge.runs.client.gameDirectory=file('build/electrical-client')
        neoForge.runs.client.systemProperty 'sun.net.client.defaultReadTimeout','5000'
        neoForge.runs.client.systemProperty 'sun.net.client.defaultConnectTimeout','5000'
        neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer','127.0.0.1:25581','--width','960','--height','640'
        tasks.named('runClient') { dependsOn 'electricalHarnessJar' }
    }
}
