// Synthetic authority-sample verification in an isolated real client/server pair.
allprojects {
    afterEvaluate {
        tasks.register('compileDisplayVisualHarness',JavaCompile) {
            source=fileTree('tools/vehicle-ui-harness'){include '**/*.java'}
            classpath=sourceSets.main.compileClasspath+sourceSets.main.output
            destinationDirectory=layout.buildDirectory.dir('vehicle-ui-classes')
            options.encoding='UTF-8'
            dependsOn 'classes'
        }
        tasks.register('speedVisualHarnessJar',Jar) {
            dependsOn 'compileDisplayVisualHarness'
            from layout.buildDirectory.dir('vehicle-ui-classes')
            from('tools/vehicle-ui-harness'){include 'META-INF/**'}
            archiveFileName='emucab-display-test.jar'
            destinationDirectory=layout.buildDirectory.dir('vehicle-ui-server/mods')
            doLast { copy { from archiveFile; into 'build/vehicle-ui-client/mods' } }
        }
        neoForge.runs.server.gameDirectory=file('build/vehicle-ui-server')
        tasks.named('runServer'){dependsOn 'speedVisualHarnessJar'}
        neoForge.runs.client.gameDirectory=file('build/vehicle-ui-client')
        neoForge.runs.client.programArguments.addAll '--quickPlayMultiplayer','127.0.0.1:25579','--width','1440','--height','900'
        tasks.named('runClient'){dependsOn 'speedVisualHarnessJar'}
    }
}
